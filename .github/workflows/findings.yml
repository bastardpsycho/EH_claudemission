name: findings
# One-off full trace on the claude/findings-run branch. Commits a summary and the
# list of post-retraction synthesis citations back to that branch for review.
on:
  push:
    branches: [claude/findings-run]
    paths: [".github/workflows/findings.yml", "scripts/summarize_findings.py", "src/fallout/validate.py", "validation/**"]
permissions:
  contents: write
concurrency:
  group: findings
  cancel-in-progress: false
jobs:
  findings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: curl -fsSL -o retraction_watch.csv https://gitlab.com/crossref/retraction-watch-data/-/raw/main/retraction_watch.csv
      - name: Fetch PubMed publication types for Health Sciences research articles
        env:
          NCBI_EMAIL: ${{ vars.OPENALEX_MAILTO }}
        run: fallout pubtypes --csv retraction_watch.csv --out rw_pubtypes.json | tee pubtypes-summary.json
      - name: Restore partial ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            ledger.json
            .cache/openalex
          key: findings-ledger-${{ github.run_id }}
          restore-keys: findings-ledger-
      - name: Trace every retracted clinical study
        timeout-minutes: 75
        continue-on-error: true
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: fallout trace --csv retraction_watch.csv --population trials --pubtypes rw_pubtypes.json --ledger ledger.json --limit 5000 --max-citing 2000 2> trace.log | tee trace-summary.json; tail -5 trace.log
      - name: Save partial ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ledger.json
            .cache/openalex
          key: findings-ledger-${{ github.run_id }}
      - name: Add PubMed publication types
        env:
          NCBI_EMAIL: ${{ vars.OPENALEX_MAILTO }}
        run: fallout enrich --ledger ledger.json | tee enrich-summary.json
      - run: python scripts/summarize_findings.py ledger.json findings retraction_watch.csv rw_pubtypes.json
      - name: Validate against VITALITY Study I
        run: |
          fallout validate --csv retraction_watch.csv --ledger ledger.json --vitality-dir validation --out-dir findings/validation
          fallout validate --csv retraction_watch.csv --population trials --pubtypes rw_pubtypes.json --ledger ledger.json --vitality-dir validation --out-dir findings/validation-trials
      - name: Commit findings
        run: |
          cp trace-summary.json enrich-summary.json pubtypes-summary.json findings/ || true
          git config user.name "fallout-bot"
          git config user.email "fallout-bot@users.noreply.github.com"
          git add -f findings
          git commit -m "Add findings from full trace run ${{ github.run_id }}"
          git pull --rebase origin claude/findings-run
          git push origin HEAD:claude/findings-run
